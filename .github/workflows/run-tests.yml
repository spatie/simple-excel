name: run-tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']
        laravel: ['13.*', '12.*', '11.*']

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, xmlreader, xmlwriter, zip, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer update --with="illuminate/support:${{ matrix.laravel }}" --prefer-stable --prefer-dist --no-interaction
          composer validate --strict

      - name: Execute tests
        run: vendor/bin/pest
